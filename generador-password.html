    .container { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; }

  <div class="container">
    <h1>Generador de Contraseñas</h1>
    <input type="text" id="pass" readonly>
    <br>
    <button onclick="gen()">Generar Nueva Clave</button>
  </div>

  <script>
    function gen() {
      const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+";
      let p = "";
      for (let i = 0; i < 16; i++) p += chars.charAt(Math.floor(Math.random() * chars.length));
      document.getElementById('pass').value = p;
    }
    gen();
  </script>
