<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Códigos QR Gratis | Soluciones Web</title>
  <meta name="description" content="Crea códigos QR personalizados gratis para enlaces, texto o redes sociales de forma instantánea.">
  
  <!-- CÓDIGO DE GOOGLE ADSENSE -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5452390334253682" crossorigin="anonymous"></script>

  <!-- LIBRERÍA QR LIGERA DESDE CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; text-align: center; }
    .container { max-width: 480px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    input[type="text"] { width: 100%; padding: 12px; margin: 15px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 15px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #3b82f6; color: white; border-radius: 6px; border: none; font-weight: bold; font-size: 15px; cursor: pointer; }
    button:hover { background: #2563eb; }
    #qrcode { margin: 20px auto; padding: 15px; background: white; border-radius: 8px; display: inline-block; min-width: 128px; min-height: 128px; }
    a.home-link { display: inline-block; margin-top: 15px; color: #38bdf8; text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Generador de Códigos QR</h1>
    <p>Introduce un enlace o texto para crear tu código QR descargable.</p>

    <input type="text" id="qrText" placeholder="https://tu-sitio-web.com o tu texto aquí">
    <button onclick="generateQR()">Generar Código QR</button>

    <div id="qrcode"></div>

    <br>
    <a href="index.html" class="home-link">← Volver a la herramienta principal</a>
  </div>

  <script>
    let qrcodeObj = null;

    function generateQR() {
      const text = document.getElementById('qrText').value.trim();
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = "";

      if (text !== "") {
        qrcodeObj = new QRCode(qrContainer, {
          text: text,
          width: 180,
          height: 180,
          colorDark : "#000000",
          colorLight : "#ffffff",
          correctLevel : QRCode.CorrectLevel.H
        });
      } else {
        alert("Por favor ingresa un texto o enlace.");
      }
    }

    // Generar uno por defecto al cargar
    window.onload = function() {
      document.getElementById('qrText').value = "https://soluciones-ten.vercel.app";
      generateQR();
    };
  </script>
</body>
</html>
