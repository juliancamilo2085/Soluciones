<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Tarifa Hora Freelance | Soluciones Web</title>
  <meta name="description" content="Calcula cuánto debes cobrar por hora de trabajo según tu meta mensual y gastos.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5452390334253682" crossorigin="anonymous"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; text-align: center; }
    .container { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; }
    nav a { color: #38bdf8; margin: 0 5px; font-size: 13px; text-decoration: none; }
    input { width: 80%; padding: 8px; margin: 5px 0; border-radius: 6px; border: none; }
    button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Conversor</a> | 
    <a href="compresor.html">Compresor</a> | 
    <a href="contador.html">Contador Texto</a> | 
    <a href="generador-password.html">Contraseñas</a> | 
    <a href="calculadora-tarifa.html">Tarifa Freelance</a>
  </nav>

  <div class="container">
    <h1>Calculadora Freelance</h1>
    <label>Meta mensual de ingresos ($):</label><br>
    <input type="number" id="goal" placeholder="2000"><br>
    <label>Horas facturables por semana:</label><br>
    <input type="number" id="hours" placeholder="25"><br>
    <button onclick="calc()">Calcular Tarifa Mínima</button>
    <h2 id="res" style="color:#10b981;"></h2>
  </div>

  <script>
    function calc() {
      const g = parseFloat(document.getElementById('goal').value);
      const h = parseFloat(document.getElementById('hours').value);
      if(g && h) {
        document.getElementById('res').innerText = '$' + (g / (h * 4)).toFixed(2) + ' USD / hora';
      }
    }
  </script>
</body>
</html>
