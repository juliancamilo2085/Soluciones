<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optimizador y Conversor de Imágenes Gratis</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; text-align: center; }
    .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; }
    input[type="file"] { display: none; }
    .upload-btn { background: #3b82f6; color: white; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; display: inline-block; margin: 10px 0; }
    select, button { padding: 10px; margin: 10px 5px; border-radius: 6px; border: none; font-size: 14px; }
    button.action-btn { background: #10b981; color: white; cursor: pointer; font-weight: bold; }
    #preview { max-width: 100%; height: auto; margin-top: 15px; border-radius: 8px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Conversor de Imágenes Ultra Rápido</h1>
    <p>Convierte y optimiza tus imágenes de forma instantánea.</p>
    <label class="upload-btn">
      Seleccionar Imagen
      <input type="file" id="imageInput" accept="image/*">
    </label>
    <div id="controls" style="display:none;">
      <br>
      <label for="format">Convertir a:</label>
      <select id="format">
        <option value="image/png">PNG</option>
        <option value="image/jpeg">JPEG</option>
        <option value="image/webp">WEBP</option>
      </select>
      <br>
      <button class="action-btn" onclick="convertImage()">Convertir y Descargar</button>
    </div>
    <img id="preview" alt="Vista previa">
  </div>
  <script>
    const imageInput = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    const controls = document.getElementById('controls');
    let loadedImage = null;
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          loadedImage = new Image();
          loadedImage.src = event.target.result;
          loadedImage.onload = () => {
            preview.src = loadedImage.src;
            preview.style.display = 'block';
            controls.style.display = 'block';
          };
        };
        reader.readAsDataURL(file);
      }
    });
    function convertImage() {
      if (!loadedImage) return;
      const canvas = document.createElement('canvas');
      canvas.width = loadedImage.width;
      canvas.height = loadedImage.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(loadedImage, 0, 0);
      const format = document.getElementById('format').value;
      const mimeExtension = format.split('/')[1];
      const dataUrl = canvas.toDataURL(format, 0.9);
      const link = document.createElement('a');
      link.download = `imagen-optimizada.${mimeExtension}`;
      link.href = dataUrl;
      link.click();
    }
  </script>
</body>
</html>
